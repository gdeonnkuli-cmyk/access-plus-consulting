<!-- Modèle EmailJS « Notification » (template_aisjy5e)
     Variables : {{nom}}, {{message}} (le sujet est transmis dans {{subject}})
     À coller dans EmailJS → Email Templates → template_aisjy5e → onglet Content → bouton « Edit Content » (mode code). -->
<div style="margin:0;padding:24px 12px;background:#F4F6FB;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #E1E6F0;">
    <tr>
      <td style="padding:26px 24px 18px;text-align:center;background:#FFFFFF;">
        <img src="https://eco-campus-rdc.vercel.app/logo.png" alt="Éco-Campus" height="46" style="height:46px;width:auto;display:inline-block;border:0;">
      </td>
    </tr>
    <tr><td style="height:5px;background:#0A2A5C;background-image:linear-gradient(90deg,#001433,#1E4FA3,#A3122A);font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:28px 28px 8px;color:#0B1A33;">
        <p style="margin:0 0 16px;font-size:22px;font-weight:bold;color:#0A2A5C;">Bonjour {{nom}},</p>
        <div style="margin:0 0 22px;font-size:15px;line-height:1.7;color:#4A5B78;white-space:pre-line;">{{message}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 28px;text-align:center;">
        <a href="https://eco-campus-rdc.vercel.app" style="display:inline-block;background:#0A2A5C;background-image:linear-gradient(135deg,#001433,#1E4FA3);color:#FFFFFF;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 28px;border-radius:12px;">Ouvrir Éco-Campus →</a>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 24px;background:#F4F6FB;border-top:1px solid #E1E6F0;text-align:center;font-size:12px;line-height:1.6;color:#8492AB;">
        Éco-Campus RDC · Formations &amp; services en République démocratique du Congo<br>
        Vous recevez ce message car vous êtes inscrit sur Éco-Campus RDC.
      </td>
    </tr>
  </table>
</div>
